# Public, read-only results page on port 80. Everything else (login, controls, API) is not
# reachable from outside: the tracker listens on 127.0.0.1 only.
# Install: copy to /etc/nginx/sites-available/lfs-public, link it into sites-enabled, remove the
# default site and reload nginx. Once there is a domain with HTTPS, proxy the whole site instead.
limit_req_zone $binary_remote_addr zone=lfs_public:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    limit_req zone=lfs_public burst=30 nodelay;

    location ~ ^/results/?$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /public/api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}
